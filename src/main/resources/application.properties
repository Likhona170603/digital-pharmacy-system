spring.application.name=DigitalPharmacySystem

spring.datasource.url=jdbc:mysql://localhost:3306/digitalpharmacydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT signing secret (replace with a securely generated secret)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
# Prescription uploads (stored outside the database; keep this folder out of git)
app.upload.dir=${UPLOAD_DIR:uploads/prescriptions}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
